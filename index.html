<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="A tiny, private anniversary and everyversary calculator.">
  <title>Everyversary</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div>
        <h1>Everyversary</h1>
      </div>
    </header>

    <section id="editor" class="panel editor" hidden aria-labelledby="editor-title">
      <div class="panel-heading">
        <h2 id="editor-title">Add an entry</h2>
        <button id="cancel-edit" class="text-button" type="button">Close</button>
      </div>
      <form id="entry-form">
        <input id="entry-id" type="hidden">
        <label>
          Name
          <input id="entry-name" name="name" type="text" maxlength="100" required placeholder="e.g. Alice">
        </label>
        <label>
          Date
          <input id="entry-date" name="date" type="text"
                 inputmode="numeric" maxlength="10"
                 placeholder="YYYY-MM-DD" required>
        </label>
        <label>
          Time <span class="optional">(optional)</span>
          <input id="entry-time" name="time" type="text"
                 inputmode="numeric" maxlength="5"
                 placeholder="HH:MM">
        </label>
        <div class="form-actions">
          <button class="button button-dark" type="submit" id="save-entry">Add entry</button>
          <button class="button button-light" type="button" id="cancel-entry">Cancel</button>
        </div>
      </form>
    </section>

    <section class="everyversaries panel">
      <div class="everyversaries-heading">
        <h2>Upcoming Everyversaries</h2>
        <section class="toolbar" aria-label="Table controls">
          <div class="toolbar-left">
            <div class="year-pagination">
              <button id="previous-year" class="text-button" type="button">← Previous</button>
              <strong id="display-year"></strong>
              <button id="next-year" class="text-button" type="button">Next →</button>
            </div>

            <label class="filter-label" for="name-filter">Name</label>
            <input id="name-filter" type="search" placeholder="Filter names" autocomplete="off">
          </div>
        </section>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">When</th>
              <th scope="col">Name</th>
              <th scope="col">Everyversary</th>
              <th scope="col" class="actions-heading"><span class="visually-hidden">Actions</span></th>
            </tr>
          </thead>
          <tbody id="everyversary-rows">
            <tr><td colspan="4" class="empty">Add someone to see upcoming everyversaries.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="entries panel">
      <div class="entries-heading">
        <div class="entries-title">
          <h2>Entries</h2>
          <span id="entry-count" class="muted"></span>
        </div>
        <button id="add-toggle" class="button button-dark" type="button">
          Add entry
        </button>
      </div>
      <div class="entries-selection">
        <label>
          <input id="select-all-entries" type="checkbox">
          Select all
        </label>
        <button id="copy-selected-link" class="text-button" type="button" hidden>
          Copy link
        </button>
      </div>

      <div class="entries-tools">
        <button id="import-button" class="text-button" type="button">Import CSV</button>
        <button id="export-button" class="text-button" type="button">Export CSV</button>
        <input id="csv-file" type="file" accept=".csv,text/csv" hidden>
      </div>

      <div id="drop-zone" class="drop-zone" tabindex="0" role="button"
           aria-label="Drop a CSV file here or click to import">
        Drop a CSV file here, or <span>choose a file</span>
      </div>

      <ul id="entry-list" class="entry-list"></ul>
    </section>

    <footer>
      <span>Stored only in this browser.</span>
      <span id="status" role="status" aria-live="polite"></span>
    </footer>
  </main>

  <template id="entry-template">
    <li class="entry-item">
      <div class="entry-description">
        <strong class="entry-person"></strong>
        <span class="entry-start muted"></span>
        <span class="entry-source muted"></span>
      </div>
      <div class="entry-actions">
        <label class="entry-share-select" hidden>
          <input class="select-entry" type="checkbox" aria-label="Select entry to share">
        </label>
        <button class="text-button save-shared" type="button" hidden>Save</button>
        <button class="text-button dismiss-shared" type="button" hidden>Dismiss</button>
        <button class="text-button copy-share" type="button" hidden>Copy link</button>
        <button class="text-button edit-entry" type="button">Edit</button>
        <button class="text-button danger delete-entry" type="button">Delete</button>
      </div>
    </li>
  </template>
</body>
</html>
